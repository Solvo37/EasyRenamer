name: Feature request
description: Suggest a focused improvement for EasyRenamer
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / workflow
      description: What real renaming task is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the simplest UI/engine behavior that would solve it.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      placeholder: |
        Before: IMG_001.jpg
        After:  01_product.jpg
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: The feature can work without accounts, ads or mandatory cloud services.
          required: true
