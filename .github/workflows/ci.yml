name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race -count=1 ./internal/...

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test core
        run: go test -race -count=1 ./internal/...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build modern desktop app
        shell: pwsh
        run: |
          wails build -clean -platform windows/amd64 -o EasyRenamer.exe -ldflags "-X github.com/Solvo37/easyrenamer/internal/version.Version=ci"
      - name: Test application methods (headless integration)
        run: go test -race -count=1 -timeout 2m .
      - name: Smoke test startup (process liveness only)
        shell: pwsh
        run: |
          $exe = ".\\build\\bin\\EasyRenamer.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if ($p.HasExited) {
            throw "EasyRenamer exited during startup smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EasyRenamer-windows-x64
          path: build/bin/EasyRenamer.exe
