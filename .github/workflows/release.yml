name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - RELEASE
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = (Get-Content RELEASE -Raw).Trim()
          }

          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EasyRenamer $version"

      - name: Test
        run: go test ./internal/...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build portable release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          wails build -clean -platform windows/amd64 -o EasyRenamer.exe -ldflags "-X github.com/Solvo37/easyrenamer/internal/version.Version=$version"

          $exe = ".\\build\\bin\\EasyRenamer.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if ($p.HasExited) {
            throw "EasyRenamer exited during startup smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/EasyRenamer.exe
          Copy-Item LICENSE dist/LICENSE
          Copy-Item README*.md dist/
          Copy-Item CONTRIBUTING*.md dist/
          Copy-Item SECURITY*.md dist/
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/LEARN*.md dist/docs/
          Copy-Item docs/TAGS*.md dist/docs/
          Copy-Item docs/ROADMAP*.md dist/docs/

          Compress-Archive -Path dist/EasyRenamer.exe,dist/LICENSE,dist/README*.md,dist/CONTRIBUTING*.md,dist/SECURITY*.md,dist/docs -DestinationPath "dist/EasyRenamer-$version-windows-x64.zip"

          $exeHash = (Get-FileHash dist/EasyRenamer.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/EasyRenamer-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()

          @(
            "$exeHash  EasyRenamer.exe"
            "$zipHash  EasyRenamer-$version-windows-x64.zip"
          ) | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: EasyRenamer ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/EasyRenamer.exe
            dist/EasyRenamer-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
