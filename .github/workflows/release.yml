name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - RELEASE
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = (Get-Content RELEASE -Raw).Trim()
          }

          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EasyRenamer $version"

      - name: Test
        run: go test ./internal/...

      - name: Build portable release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          go mod download
          go run github.com/akavel/rsrc@latest -manifest cmd/easyrenamer/easyrenamer.exe.manifest -o cmd/easyrenamer/rsrc.syso

          New-Item -ItemType Directory -Force dist | Out-Null

          go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/Solvo37/easyrenamer/internal/version.Version=$version" -o dist/EasyRenamer.exe ./cmd/easyrenamer

          $p = Start-Process -FilePath .\dist\EasyRenamer.exe -PassThru
          Start-Sleep -Seconds 3
          $p.Refresh()
          if ($p.HasExited) {
            throw "EasyRenamer exited during startup smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force

          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Copy-Item docs/TAGS.md dist/TAGS.md
          Copy-Item docs/LEARN.md dist/LEARN.md

          Compress-Archive -Path dist/EasyRenamer.exe,dist/README.md,dist/LICENSE,dist/TAGS.md,dist/LEARN.md -DestinationPath "dist/EasyRenamer-$version-windows-x64.zip"

          $exeHash = (Get-FileHash dist/EasyRenamer.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/EasyRenamer-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()

          @(
            "$exeHash  EasyRenamer.exe"
            "$zipHash  EasyRenamer-$version-windows-x64.zip"
          ) | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: EasyRenamer ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/EasyRenamer.exe
            dist/EasyRenamer-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
