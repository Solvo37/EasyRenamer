name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./internal/...
      - name: Build
        shell: pwsh
        run: |
          go mod tidy
          go run github.com/akavel/rsrc@latest -manifest cmd/easyrenamer/easyrenamer.exe.manifest -o cmd/easyrenamer/rsrc.syso
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/Solvo37/easyrenamer/internal/version.Version=${{ github.ref_name }}" -o dist/EasyRenamer.exe ./cmd/easyrenamer
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/EasyRenamer.exe,dist/README.md,dist/LICENSE -DestinationPath dist/EasyRenamer-${{ github.ref_name }}-windows-x64.zip
          (Get-FileHash dist/EasyRenamer.exe -Algorithm SHA256).Hash.ToLower() + "  EasyRenamer.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EasyRenamer.exe
            dist/EasyRenamer-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
